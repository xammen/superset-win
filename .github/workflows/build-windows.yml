name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable long paths (must precede checkout)
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The repo carries the full patched monorepo; full history is not
          # needed for the build itself.
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Fix i18n bunx resolution (isolated linker shim issue on CI)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/i18n/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.scripts.extract = j.scripts.extract.replace('bunx --bun lingui', 'lingui');
            j.scripts.compile = j.scripts.compile.replace('bunx --bun lingui', 'lingui');
            fs.writeFileSync(p, JSON.stringify(j, null, '\t') + '\n');
          "

      - name: Generate file icons
        working-directory: apps/desktop
        shell: bash
        run: bun run generate:icons

      - name: Build app
        working-directory: apps/desktop
        shell: bash
        run: bun run compile:app

      - name: Prepare native modules
        working-directory: apps/desktop
        shell: bash
        run: bun run copy:native-modules

      - name: Patch better-sqlite3 prebuilt for Electron ABI
        shell: bash
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const fs = require('node:fs');
            const path = require('node:path');
            const pkg = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
            const version = pkg.dependencies['better-sqlite3'];
            const electronVersion = JSON.parse(fs.readFileSync('node_modules/electron/package.json', 'utf8')).version;
            const abi = execSync('node -p process.versions.modules', { env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' } }).toString().trim();
            console.log('better-sqlite3', version, 'electron', electronVersion, 'abi', abi);
            const tmp = 'bs3-prebuild';
            fs.mkdirSync(tmp, { recursive: true });
            const tarball = path.join(tmp, 'prebuild.tar.gz');
            execSync('gh release download v' + version + ' --repo WiseLibs/better-sqlite3 --pattern better-sqlite3-v' + version + '-electron-v' + abi + '-win32-x64.tar.gz --dir ' + tmp, { stdio: 'inherit', shell: 'bash' });
            execSync('tar -xzf ' + tarball + ' -C ' + tmp, { stdio: 'inherit', shell: 'bash' });
            const binary = path.join(tmp, 'build/Release/better_sqlite3.node');
            const targets = execSync('node -e \"const g=require(\'node:fs\').readdirSync;\" 2>nul || dir /s /b better_sqlite3.node', { shell: 'cmd' });
            " || true
          # Simpler, robust replacement using bash find:
          EXE=$(find . -path ./node_modules/.bun -prune -o -name "better_sqlite3.node" -print | head -5)
          echo "Found binaries: $EXE"
          for f in $EXE; do
            cp bs3-prebuild/build/Release/better_sqlite3.node "$f"
            echo "Patched $f"
          done

      - name: Build Windows installer
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never --config electron-builder.ts

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="desktop-v${VERSION}"
          gh release create "$TAG" \
            apps/desktop/release/Superset-${VERSION}-x64.exe \
            --repo ${{ github.repository }} \
            --title "Superset ${VERSION} (Windows, patched)" \
            ${{ inputs.prerelease == true && '--prerelease' || '' }} \
            --notes "Unofficial Windows build of [superset-sh/superset](https://github.com/superset-sh/superset) ${VERSION} with Windows stability patches applied.

          Fixes included on top of upstream:
          - No UI freeze when switching workspaces/tabs (file watcher offloaded to a worker thread)
          - No console window flash (watchman probe bypassed, windowsHide enforced in every process)
          - Working terminal env for Windows installers (OS, USERNAME, PSModulePath, ...)
          - Host-service CORS accepts the Windows renderer origin
          - pty-daemon starts correctly under the packaged executable
          - better-sqlite3 matched to the Electron ABI

          See PATCHES.md for the full list."
