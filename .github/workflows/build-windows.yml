name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable long paths (must precede checkout)
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The repo carries the full patched monorepo; full history is not
          # needed for the build itself.
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Fix i18n bunx resolution (isolated linker shim issue on CI)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/i18n/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.scripts.extract = j.scripts.extract.replace('bunx --bun lingui', 'lingui');
            j.scripts.compile = j.scripts.compile.replace('bunx --bun lingui', 'lingui');
            fs.writeFileSync(p, JSON.stringify(j, null, '\t') + '\n');
          "

      - name: Generate file icons
        working-directory: apps/desktop
        shell: bash
        run: bun run generate:icons

      - name: Build app
        working-directory: apps/desktop
        shell: bash
        run: bun run compile:app

      - name: Prepare native modules
        working-directory: apps/desktop
        shell: bash
        run: bun run copy:native-modules

      - name: Patch better-sqlite3 prebuilt for Electron ABI
        shell: bash
        run: |
          set -e
          # With bun's isolated linker, packages live under node_modules/.bun.
          # Resolve the real paths instead of assuming a hoisted layout.
          ELECTRON_PKG=$(find node_modules/.bun -maxdepth 1 -type d -name "electron@*" | head -1)
          BS3_PKG=$(find node_modules/.bun -maxdepth 1 -type d -name "better-sqlite3@*" | head -1)
          ELECTRON_VERSION=$(node -p "require('./${ELECTRON_PKG}/node_modules/electron/package.json').version")
          BS3_VERSION=$(node -p "require('./${BS3_PKG}/node_modules/better-sqlite3/package.json').version")
          # Electron's ABI (NODE_MODULE_VERSION) — read from the electron package's
          # own binary via ELECTRON_RUN_AS_NODE.
          ABI=$(ELECTRON_RUN_AS_NODE=1 "${ELECTRON_PKG}/node_modules/electron/dist/electron.exe" -p process.versions.modules)
          echo "better-sqlite3 ${BS3_VERSION}, electron ${ELECTRON_VERSION}, ABI ${ABI}"

          TMP=bs3-prebuild
          mkdir -p "$TMP"
          gh release download "v${BS3_VERSION}" \
            --repo WiseLibs/better-sqlite3 \
            --pattern "better-sqlite3-v${BS3_VERSION}-electron-v${ABI}-win32-x64.tar.gz" \
            --dir "$TMP"
          tar -xzf "$TMP/better-sqlite3-v${BS3_VERSION}-electron-v${ABI}-win32-x64.tar.gz" -C "$TMP"

          # Substitute every materialized copy the packaging step will pick up:
          # the desktop workspace node_modules and the bun store entry.
          TARGETS=$(find apps/desktop/node_modules node_modules/.bun -name "better_sqlite3.node" 2>/dev/null)
          echo "Targets: $TARGETS"
          for f in $TARGETS; do
            cp "$TMP/build/Release/better_sqlite3.node" "$f"
            echo "Patched $f"
          done

      - name: Build Windows installer
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never --config electron-builder.ts

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="desktop-v${VERSION}"
          gh release create "$TAG" \
            apps/desktop/release/Superset-${VERSION}-x64.exe \
            --repo ${{ github.repository }} \
            --title "Superset ${VERSION} (Windows, patched)" \
            ${{ inputs.prerelease == true && '--prerelease' || '' }} \
            --notes "Unofficial Windows build of [superset-sh/superset](https://github.com/superset-sh/superset) ${VERSION} with Windows stability patches applied.

          Fixes included on top of upstream:
          - No UI freeze when switching workspaces/tabs (file watcher offloaded to a worker thread)
          - No console window flash (watchman probe bypassed, windowsHide enforced in every process)
          - Working terminal env for Windows installers (OS, USERNAME, PSModulePath, ...)
          - Host-service CORS accepts the Windows renderer origin
          - pty-daemon starts correctly under the packaged executable
          - better-sqlite3 matched to the Electron ABI

          See PATCHES.md for the full list."
